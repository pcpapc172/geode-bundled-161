name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Sign APKs
        run: |
          APKSIGNER=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | tail -1)/apksigner
          for apk in app/build/outputs/apk/release/*-unsigned.apk; do
            out="${apk/-unsigned/}"
            $APKSIGNER sign --ks release.jks --ks-key-alias key \
              --ks-pass pass:android --key-pass pass:android \
              --out "$out" "$apk"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: geode-bundled-161
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-universal-release.apk
